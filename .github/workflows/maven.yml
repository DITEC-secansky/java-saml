# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: java-saml CI with Maven

on: [push, pull_request, workflow_dispatch]

jobs:
  test:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Java 8 vypustena: fork pouziva xmlsec 4.0.2 (Santuario), ktory vyzaduje Java 11+.
        java: [ '11', '17' ]
        os: [ 'ubuntu-latest' ]
    name: Java ${{ matrix.java }} (${{ matrix.os }})
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
        cache: 'maven'
    # OWASP dependency-check (bindnuty na 'verify') sa tu preskakuje - na CI by
    # stahoval celu NVD databazu a bez NVD_API_KEY casto pada na rate-limit (403).
    # Bezpecnostny sken je vhodnejsie spustat samostatne, napr. s NVD API klucom:
    #   mvn --batch-mode verify -DnvdApiKey=${{ secrets.NVD_API_KEY }}
    - name: Maven Test
      run: mvn --batch-mode clean verify org.jacoco:jacoco-maven-plugin:report -Ddependency-check.skip=true